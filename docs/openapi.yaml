openapi: 3.0.3
info:
  title: Bubble White API
  description: Catalog, RBAC admin panel, and settings API for the Bubble White storefront.
  version: "1.0.0"
servers:
  - url: /api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        meta: {}
        error: { type: string }
    Product:
      type: object
      properties:
        id: { type: string, example: bw-basic-tee }
        name: { type: string }
        price: { type: number, format: float }
        compareAt: { type: number, nullable: true }
        category: { type: string, example: t-shirts }
        badge: { type: string, nullable: true }
        featured: { type: boolean }
        sizes: { type: array, items: { type: string } }
        images: { type: array, items: { type: string } }
        description: { type: string }
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        image: { type: string }
    Settings:
      type: object
      properties:
        companyName: { type: string }
        companyDetail: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        contactAddress: { type: string }
        workingHours: { type: string }
        facebookUrl: { type: string }
        instagramUrl: { type: string }
        tiktokUrl: { type: string }
        telegramUrl: { type: string }
        logoUrl: { type: string }
    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
        isSystem: { type: boolean }

paths:
  /auth/login:
    post:
      summary: Admin login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: OK }
        "401": { description: Invalid credentials }

  /products:
    get:
      summary: List products (public)
      tags: [Products]
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: featured
          schema: { type: boolean }
        - in: query
          name: sortBy
          schema: { type: string, enum: [price, name, created_at] }
        - in: query
          name: sortDir
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 10 }
      responses:
        "200": { description: OK }

  /products/{id}:
    get:
      summary: Get a product (public)
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /products/{id}/related:
    get:
      summary: Related products (public)
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 4 }
      responses:
        "200": { description: OK }

  /admin/products:
    post:
      summary: Create a product (requires product.create)
      tags: [Admin - Products]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
        "403": { description: Forbidden }

  /admin/products/{id}:
    put:
      summary: Update a product (requires product.update)
      tags: [Admin - Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
    delete:
      summary: Delete a product (requires product.delete)
      tags: [Admin - Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /categories:
    get:
      summary: List categories (public)
      tags: [Categories]
      responses:
        "200": { description: OK }

  /admin/categories:
    post:
      summary: Create a category (requires category.create)
      tags: [Admin - Categories]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }

  /admin/categories/{id}:
    put:
      summary: Update a category (requires category.update)
      tags: [Admin - Categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
    delete:
      summary: Delete a category (requires category.delete)
      tags: [Admin - Categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /settings:
    get:
      summary: Get company/contact settings (public)
      tags: [Settings]
      responses:
        "200": { description: OK }

  /admin/settings:
    put:
      summary: Update company/contact settings (requires settings.update)
      tags: [Admin - Settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { description: OK }

  /contact:
    post:
      summary: Submit the storefront contact form (public)
      tags: [Contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string }
                email: { type: string }
                subject: { type: string }
                message: { type: string }
      responses:
        "201": { description: Created }

  /admin/contacts:
    get:
      summary: List contact messages (requires contact.view)
      tags: [Admin - Contact]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }

  /admin/contacts/{id}/read:
    patch:
      summary: Mark a message read (requires contact.manage)
      tags: [Admin - Contact]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }

  /admin/users:
    get:
      summary: List admin users (requires user.view)
      tags: [Admin - Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      summary: Create an admin user (requires user.create)
      tags: [Admin - Users]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }

  /admin/users/{id}/role:
    patch:
      summary: Assign a role to a user (requires user.manage)
      tags: [Admin - Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: { type: integer }
      responses:
        "200": { description: OK }

  /admin/roles:
    get:
      summary: List roles (requires role.view)
      tags: [Admin - Roles]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      summary: Create a role (requires role.create)
      tags: [Admin - Roles]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }

  /admin/roles/{id}:
    put:
      summary: Update a role's permissions (requires role.update)
      tags: [Admin - Roles]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
    delete:
      summary: Delete a role (requires role.delete; system roles rejected)
      tags: [Admin - Roles]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/permissions:
    get:
      summary: List the full permission catalog (requires role.view)
      tags: [Admin - Roles]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }

  /admin/uploads/products:
    post:
      summary: Upload a product image to R2 (requires product.update)
      tags: [Admin - Uploads]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Created }

  /admin/uploads/categories:
    post:
      summary: Upload a category image to R2 (requires category.update)
      tags: [Admin - Uploads]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Created }

  /admin/uploads/site:
    post:
      summary: Upload a site image (e.g. logo) to R2 (requires settings.update)
      tags: [Admin - Uploads]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Created }
