name: Backend CI

# Runs on every push and pull request. This does NOT deploy anything —
# Railway's own GitHub integration handles deployment separately (see
# DEPLOY.md). This workflow's only job is to catch a broken build or
# unformatted code BEFORE it reaches Railway, since Railway's build step
# happening in production is the wrong place to find out `go build` fails.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
